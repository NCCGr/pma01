# Local test servers and the phpMyAdmin 5.2.3 oracle that the parity harnesses compare against.
# Start with `npm run db:up`, then run `npm run dev-vars` to point .dev.vars at them.
name: dbadmin

x-database: &database
  restart: unless-stopped
  volumes:
    - ./initdb:/docker-entrypoint-initdb.d:ro

services:
  mysql:
    <<: *database
    image: mysql:8.4
    container_name: dbadmin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DBADMIN_ROOT_PASSWORD:-dbadmin-root}
      MYSQL_DATABASE: customer_db
      MYSQL_USER: customer
      MYSQL_PASSWORD: customerpw
    ports:
      - 127.0.0.1:33306:3306
      - '[::1]:33306:3306'
    healthcheck:
      # TCP so the check only passes once the init scripts are done and the real server listens.
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 3s
      timeout: 5s
      retries: 60

  mariadb:
    <<: *database
    image: mariadb:12.3
    container_name: dbadmin-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DBADMIN_ROOT_PASSWORD:-dbadmin-root}
      MARIADB_DATABASE: customer_db
      MARIADB_USER: customer
      MARIADB_PASSWORD: customerpw
    ports:
      - 127.0.0.1:33307:3306
      - '[::1]:33307:3306'
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 60

  mysql57:
    <<: *database
    image: mysql:5.7.44
    container_name: dbadmin-mysql57
    # The 5.7 image is only published for amd64.
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${DBADMIN_ROOT_PASSWORD:-dbadmin-root}
      MYSQL_DATABASE: customer_db
      MYSQL_USER: customer
      MYSQL_PASSWORD: customerpw
    ports:
      - 127.0.0.1:33308:3306
      - '[::1]:33308:3306'
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 3s
      timeout: 5s
      retries: 60

  pma:
    image: phpmyadmin:5.2.3
    container_name: dbadmin-pma
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - ./pma/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    ports:
      - 127.0.0.1:8088:80
    depends_on:
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      mysql57:
        condition: service_healthy
